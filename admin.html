<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EventFlow admin workspace.">
  <title>Admin Workspace — EventFlow</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

      <a href="index.html" class="brand" aria-label="EventFlow home"><img src="assets/logo/logo.svg" alt="" width="28" height="28"><span>EventFlow</span></a>
      <div class="profile-wrap">
        <button class="profile-trigger" id="profileTrigger" type="button" aria-expanded="false"><span class="avatar">AS</span><span class="profile-copy"><strong>Anirudh Sharma</strong><small>Admin</small></span><span class="chevron">⌄</span></button>
        <div class="profile-menu" id="profileMenu" hidden><button type="button" data-action="profile">Profile</button><button type="button" data-action="settings">Settings</button><button type="button" data-action="logout">Logout</button></div>
      </div>
    </header>
    <main id="app" class="app-main"></main>
  </div>
  <div id="modalRoot"></div>
  <script src="js/firebase-config.js"></script>
  <script src="js/admin.js"></script>
